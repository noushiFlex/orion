# Orion v1.3: v1.2 + pre-closing market-average odds as a feature (known before kickoff, also in fixtures).
name: orion-v1.3
seed: 42

data:
  leagues: [E0, SP1, D1, I1, F1]
  seasons: {first: "1516", last: "2627"}
  warmup_seasons: 1  # 2015/16 only warms up rolling features and Elo; it never provides training rows

features:
  form: {windows: [5, 10], min_periods: 3}
  elo: {k: 20, home_advantage: 65, start: 1500, promoted_start: 1400}
  clubelo: {max_age_days: 45}
  rest: {cap_days: 30}
  goalrate: {targets: [goals, xg], lr: 0.04, season_shrink: 0.75}
  market: {kind: pre}

models:
  market: {}  # Pinnacle closing odds, margin removed: the bar to beat
  poisson: {alpha: 1.0, max_goals: 10}
  logit: {C: 0.05}
  gbm: {learning_rate: 0.02, max_iter: 400, max_leaf_nodes: 7, min_samples_leaf: 200, l2_regularization: 5.0}

ensemble: {poisson: 0.4, logit: 0.4, gbm: 0.2}

backtest:
  test_seasons: ["2223", "2324", "2425", "2526"]

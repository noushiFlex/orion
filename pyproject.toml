[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion"
version = "0.1.0"
description = "Football match outcome model: point-in-time features, walk-forward backtests."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "pyyaml>=6",
    "joblib>=1.4",
    "certifi",
    "duckdb>=1.0",
    "rich>=13",
    "plotext>=5.2,<6",  # 6.x rewrote the API (no plot/build/clf)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["matplotlib>=3.8"]

[project.scripts]
orion = "orion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
